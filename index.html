<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip小費計算機</title>

    <!-- =============================================
         PWA / HOME SCREEN (iOS)
         Allows "Add to Home Screen" on iPhone to work
         like a standalone app with a matching icon.
         ============================================= -->
    <!-- href is left empty — filled at runtime by generateAppIcon() via canvas -->
    <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="小費雞">
    <meta name="theme-color" content="#38bdf8">

    <!-- =============================================
         EXTERNAL DEPENDENCIES
         All loaded via CDN — no build step required.
         ============================================= -->
    <!-- Tailwind CSS (runtime JIT compiler) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts — Inter (400/600/700) for clean UI typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 — icons for calculator, location, invoice, spinner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- =============================================
         TAILWIND CONFIG
         Extends the default theme with custom brand
         colors used throughout the UI.
         ============================================= -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',    // Page background (slate-900)
                            card: '#1e293b',    // Card background (slate-800) — used in .glass-panel
                            accent: '#38bdf8',  // Primary accent (sky-400) — buttons, highlights, result card
                            success: '#34d399', // Success text (emerald-400) — geolocation confirmation
                            text: '#f1f5f9',    // Primary text (slate-100)
                            muted: '#94a3b8'    // Secondary/label text (slate-400)
                        }
                    }
                }
            }
        }
    </script>

    <!-- =============================================
         CUSTOM STYLES
         - Range slider: overrides browser defaults for
           a consistent look (sky-blue thumb, slate track)
         - Number input: hides the native spin buttons
         - Glass panel: frosted-glass card effect
         - Spinner: rotation keyframe for loading state
         ============================================= -->
    <style>
        /* Custom Range Slider — override native browser chrome */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            margin-top: -10px; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }

        /* Remove inner spin button for number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        /* Glassmorphism card — semi-transparent with backdrop blur */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);       /* brand-card at 70% opacity */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);      /* Safari support */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Loading spinner animation — used during geolocation fetch */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .fa-spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<!-- =============================================
     PAGE LAYOUT
     Single centered column (max-w-md), three sections:
       1. Header — app title + subtitle
       2. Main Card — tax rate, pre/post-tax inputs, tip slider
       3. Result Card — tip amount, total pay, tax breakdown
     ============================================= -->
<body class="bg-brand-dark min-h-screen flex items-center justify-center p-4 font-sans text-brand-text selection:bg-brand-accent selection:text-brand-dark">

    <div class="w-full max-w-md space-y-6">

        <!-- ===== SECTION 1: Header ===== -->
        <div class="text-center space-y-1">
            <h1 class="text-3xl font-bold tracking-tight text-white">
                <i class="fa-solid fa-calculator text-brand-accent mr-2"></i>小費雞
            </h1>
            <p class="text-brand-muted text-sm">輸入稅前或稅後金額，自動計算</p>
        </div>

        <!-- ===== SECTION 2: Main Input Card (glass-panel) ===== -->
        <div class="glass-panel rounded-3xl p-6 shadow-2xl relative overflow-hidden">
            <!-- Decorative gradient blob — purely cosmetic accent glow -->
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 rounded-full bg-brand-accent opacity-10 blur-2xl pointer-events-none"></div>

            <!-- Tax Rate — editable number input + geolocation auto-detect button.
                 Default: 9.38% (Santa Clara County, CA).
                 The "自動偵測" button triggers reverse-geocoding to set the rate. -->
            <div class="mb-6 bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                <div class="flex items-center justify-between">
                    <label class="text-sm text-brand-muted flex items-center gap-2">
                        <i class="fa-solid fa-file-invoice-dollar"></i> 綜合銷售稅率 (%)
                    </label>
                    <div class="flex items-center gap-2">
                        <button id="locateBtn" class="text-brand-accent hover:text-white hover:bg-brand-accent/20 p-2 rounded-lg transition-all text-xs flex items-center gap-1" title="根據位置自動設定稅率">
                            <i class="fa-solid fa-location-crosshairs"></i>
                            <span class="hidden sm:inline">自動偵測</span>
                        </button>
                        <input type="number" id="taxRate" value="10.00" step="0.01" class="bg-transparent text-right font-bold text-brand-accent focus:outline-none w-20 border-b border-dashed border-slate-600 focus:border-brand-accent transition-colors" inputmode="decimal">
                    </div>
                </div>
                <div id="locationMsg" class="text-[10px] text-right text-brand-success mt-1 hidden"></div>
            </div>

            <!-- Amount Inputs — side-by-side pre-tax and post-tax fields.
                 Editing one auto-calculates the other via updateCalculations(). -->
            <div class="space-y-5">
                <div class="grid grid-cols-2 gap-4">

                    <!-- Pre-Tax Input — the primary input; tip is calculated from this value -->
                    <div class="relative group">
                        <label for="preTaxInput" class="block text-xs font-semibold uppercase tracking-wider text-brand-muted mb-1 ml-1">稅前金額 (Pre-tax)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">$</span>
                            <input type="number" id="preTaxInput" placeholder="0.00" inputmode="decimal" class="w-full bg-slate-800 text-white text-xl font-bold py-4 pl-10 pr-4 rounded-xl border-2 border-slate-700 focus:border-brand-accent focus:outline-none focus:ring-4 focus:ring-brand-accent/20 transition-all placeholder-slate-600">
                        </div>
                    </div>

                    <!-- Post-Tax Input — back-calculates pre-tax as: postTax / (1 + taxRate) -->
                    <div class="relative group">
                        <label for="postTaxInput" class="block text-xs font-semibold uppercase tracking-wider text-brand-muted mb-1 ml-1">稅後總額 (Post-tax)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">$</span>
                            <input type="number" id="postTaxInput" placeholder="0.00" inputmode="decimal" class="w-full bg-slate-800 text-brand-text text-xl font-bold py-4 pl-10 pr-4 rounded-xl border-2 border-slate-700 focus:border-purple-500 focus:outline-none focus:ring-4 focus:ring-purple-500/20 transition-all placeholder-slate-600">
                        </div>
                    </div>
                </div>
                <!-- Tip Slider — range 10%-24%, step 1%, default 15% -->
                <div class="pt-2 pb-4">
                    <div class="flex justify-between items-end mb-4">
                        <label class="text-sm font-semibold text-brand-text">小費比例 (Tip %)</label>
                        <span id="tipPercentDisplay" class="text-2xl font-bold text-brand-accent">15%</span>
                    </div>
                    <input type="range" id="tipSlider" min="10" max="24" value="15" step="1" class="w-full">
                    <div class="flex justify-between text-xs text-brand-muted mt-2 px-1">
                        <span>10%</span>
                        <span>17%</span>
                        <span>24%</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- ===== SECTION 3: Result Card =====
             Displays: tip amount | total pay (pre-tax + tax + tip)
             Footer shows tax amount and a note that tip is based on pre-tax. -->
        <div class="bg-brand-accent rounded-3xl p-6 shadow-lg shadow-brand-accent/20 text-brand-dark transform transition-all duration-300">
            <div class="grid grid-cols-2 gap-4 divide-x divide-black/10">
                
                <!-- Tip Amount -->
                <div class="text-center pr-2">
                    <p class="text-xs font-bold uppercase tracking-wider opacity-70 mb-1">小費金額</p>
                    <p class="text-3xl font-extrabold flex items-center justify-center gap-0.5">
                        <span class="text-lg opacity-60">$</span>
                        <span id="tipAmountDisplay">0.00</span>
                    </p>
                </div>

                <!-- Total Pay -->
                <div class="text-center pl-2">
                    <p class="text-xs font-bold uppercase tracking-wider opacity-70 mb-1">總支付金額</p>
                    <p class="text-4xl font-extrabold flex items-center justify-center gap-0.5">
                        <span class="text-xl opacity-60">$</span>
                        <span id="totalPayDisplay">0.00</span>
                    </p>
                </div>
            </div>
            
            <!-- Breakdown -->
            <div class="mt-6 pt-4 border-t border-black/10 flex justify-between text-xs font-semibold opacity-70">
                <span>稅額 (Tax): $<span id="taxAmountDisplay">0.00</span></span>
                <span>(小費基於稅前金額計算)</span>
            </div>
        </div>

    </div>

    <!-- =============================================
         JAVASCRIPT
         Architecture:
           1. DOM refs — cached element references
           2. State — taxRate, tipPercent, preTaxAmount
           3. TAX_RATES_DB — hardcoded lookup table for geolocation
           4. Utilities — formatCurrency(), parseInput()
           5. Geolocation handler — reverse-geocode → lookup tax rate
           6. updateCalculations() — core math, updates all display elements
           7. Event listeners — input handlers for tax rate, amounts, slider
           8. Init — calls updateCalculations() once on page load

         Key formula:
           tip     = preTax × (tipPercent / 100)   ← tip on pre-tax only
           tax     = preTax × (taxRate / 100)
           postTax = preTax + tax
           total   = postTax + tip
         ============================================= -->
    <script>
        /* ---- 1. DOM Element References ---- */
        const taxRateInput = document.getElementById('taxRate');
        const locateBtn = document.getElementById('locateBtn');
        const locationMsg = document.getElementById('locationMsg');
        const preTaxInput = document.getElementById('preTaxInput');
        const postTaxInput = document.getElementById('postTaxInput');
        const tipSlider = document.getElementById('tipSlider');
        const tipPercentDisplay = document.getElementById('tipPercentDisplay');
        const tipAmountDisplay = document.getElementById('tipAmountDisplay');
        const totalPayDisplay = document.getElementById('totalPayDisplay');
        const taxAmountDisplay = document.getElementById('taxAmountDisplay');

        /* ---- 2. Mutable State ---- */
        let taxRate = 10.00;     // Combined sales tax %, synced with #taxRate input
        let tipPercent = 15;     // Tip %, synced with #tipSlider
        let preTaxAmount = 0;    // Source-of-truth dollar amount before tax

        /* ---- 3. Tax Rate Lookup Table ----
           Used by geolocation to auto-set taxRate.
           Structure:
             - Non-US countries: { rate, name }
             - US: nested by state, with California broken out by county.
           NOTE: These are approximate combined rates (state + county + district).
                 They may drift over time — not a live API. */
        const TAX_RATES_DB = {
            'TW': { rate: 5.00, name: '台灣 (營業稅)' },
            'JP': { rate: 10.00, name: '日本 (消費稅)' },
            'KR': { rate: 10.00, name: '韓國 (VAT)' },
            'GB': { rate: 20.00, name: '英國 (VAT)' },
            'AU': { rate: 10.00, name: '澳洲 (GST)' },
            'US': {
                'default': 6.00, // US general fallback
                'CA_DEFAULT': 7.25, // CA State Minimum Rate
                'CA_COUNTIES': {
                    // Common Combined Sales Tax Rates (State + County + District/City Avg)
                    'LOS ANGELES COUNTY': 9.50,
                    'SAN DIEGO COUNTY': 7.75,
                    'SAN FRANCISCO': 8.63, // SF is County/City combined
                    'SACRAMENTO COUNTY': 8.75,
                    'ORANGE COUNTY': 7.75,
                    'SANTA CLARA COUNTY': 10.00, // Measure A effective Apr 1 2026 (+0.625%)
                    'ALAMEDA COUNTY': 10.25,
                    'RIVERSIDE COUNTY': 7.75,
                    'SAN MATEO COUNTY': 9.38,
                    'CONTRA COSTA COUNTY': 8.75
                    // Add more counties as needed...
                },
                'NV_DEFAULT': 6.85, // Nevada state fallback if county not found
                'NV_COUNTIES': {
                    // Combined rates (state 4.60% + county/local) — no city tax in NV
                    'CLARK COUNTY':       8.375, // Las Vegas, Henderson, North Las Vegas, Boulder City
                    'WASHOE COUNTY':      8.265, // Reno, Sparks
                    'CARSON CITY COUNTY': 7.60,  // Carson City (independent city — Nominatim returns as county)
                    'DOUGLAS COUNTY':     7.10,  // Lake Tahoe NV side (Stateline, Zephyr Cove, Minden)
                    'NYE COUNTY':         7.60,  // Pahrump
                },
                // Fallbacks for simple state matches
                'NY': 8.88,  // NYC approx
                'TX': 8.25,
                'FL': 6.00,
                'WA': 9.47,
                'IL': 10.25,
                'NV': 6.85,  // Nevada fallback (actual rate depends on county — use NV_COUNTIES above)
            }
        };

        /* ---- 4. Utility Functions ---- */

        // Format a number as "1,234.56" (US locale, always 2 decimal places)
        const formatCurrency = (num) => {
            return new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(num);
        };

        // Safely parse a string to float; returns 0 on NaN/empty
        const parseInput = (val) => parseFloat(val) || 0;

        /* ---- 5. Geolocation Auto-Detect ----
           Flow: browser geolocation → lat/lng → OpenStreetMap Nominatim
                 reverse geocode → extract country/state/county → lookup in
                 TAX_RATES_DB → update taxRate + UI.
           Fallback chain for US:
             CA county → CA default (7.25%) → US default (6%)
             NV county (Clark/Washoe/Douglas/etc.) → NV default (6.85%) → US default (6%)
             Other states → flat state rate → US default (6%) */
        locateBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('您的瀏覽器不支援地理位置功能。');
                return;
            }

            // UI Loading State
            const originalBtnContent = locateBtn.innerHTML;
            locateBtn.innerHTML = '<i class="fa-solid fa-spinner"></i> 偵測中...';
            locateBtn.disabled = true;
            
            // Reset message styles
            locationMsg.classList.add('hidden');
            locationMsg.classList.remove('text-yellow-500');
            locationMsg.classList.add('text-brand-success');

            navigator.geolocation.getCurrentPosition(async (position) => {
                try {
                    const { latitude, longitude } = position.coords;
                    
                    // Use OpenStreetMap Nominatim API
                    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`;
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`Location API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    const address = data.address || {};
                    const countryCode = (address.country_code || '').toUpperCase();

                    // Debug: log raw address fields (useful for diagnosing mobile issues)
                    console.log('[TipCalc] Nominatim address:', JSON.stringify(address));

                    let foundRate = null;
                    let locationName = '';

                    // Logic to determine rate
                    if (TAX_RATES_DB[countryCode]) {
                        if (countryCode === 'US') {
                            const state = address.state || '';
                            // ISO3166-2-lvl4 gives "US-CA", "US-NY", etc. — more reliable on mobile
                            const stateCode = (address['ISO3166-2-lvl4'] || '').replace('US-', '');
                            // county may be absent on mobile; fall back to suburb or empty string
                            const county = address.county || address.suburb || '';
                            // city may be absent; try town/village fallbacks
                            const city = address.city || address.town || address.village || '';

                            // Helper: normalize county string → lookup key
                            // e.g. "Santa Clara County" or "Santa Clara" → "SANTA CLARA COUNTY"
                            const toCountyKey = (c) => c.toUpperCase().replace(/ COUNTY$/, '').trim() + ' COUNTY';

                            // 1. California — county-level lookup
                            const isCA = state.includes('California') || stateCode === 'CA';
                            // 2. Nevada — county-level lookup (Las Vegas / Reno area)
                            const isNV = state.includes('Nevada') || stateCode === 'NV';

                            if (isCA) {
                                const countyKey = toCountyKey(county);
                                if (TAX_RATES_DB.US.CA_COUNTIES[countyKey]) {
                                    foundRate = TAX_RATES_DB.US.CA_COUNTIES[countyKey];
                                    locationName = city ? `${city}, ${county} (加州)` : `${county} (加州)`;
                                } else {
                                    foundRate = TAX_RATES_DB.US.CA_DEFAULT;
                                    locationName = '加州 (CA 州基本稅率)';
                                }

                            } else if (isNV) {
                                const countyKey = toCountyKey(county);
                                if (TAX_RATES_DB.US.NV_COUNTIES[countyKey]) {
                                    foundRate = TAX_RATES_DB.US.NV_COUNTIES[countyKey];
                                    locationName = city ? `${city}, ${county} (內華達)` : `${county} (內華達)`;
                                } else {
                                    foundRate = TAX_RATES_DB.US.NV_DEFAULT;
                                    locationName = '內華達 (NV 預設)';
                                }

                            } else {
                                // Flat state-level fallbacks
                                if      (state.includes('New York')  || stateCode === 'NY') { foundRate = TAX_RATES_DB.US.NY; locationName = '紐約 (New York)'; }
                                else if (state.includes('Texas')      || stateCode === 'TX') { foundRate = TAX_RATES_DB.US.TX; locationName = '德州 (Texas)'; }
                                else if (state.includes('Florida')    || stateCode === 'FL') { foundRate = TAX_RATES_DB.US.FL; locationName = '佛羅里達 (Florida)'; }
                                else if (state.includes('Washington') || stateCode === 'WA') { foundRate = TAX_RATES_DB.US.WA; locationName = '華盛頓州 (Washington)'; }
                                else if (state.includes('Illinois')   || stateCode === 'IL') { foundRate = TAX_RATES_DB.US.IL; locationName = '伊利諾州 (Illinois)'; }
                                else if (state.includes('Nevada')     || stateCode === 'NV') { foundRate = TAX_RATES_DB.US.NV; locationName = '內華達 (Nevada)'; }

                                if (foundRate === null) {
                                    foundRate = TAX_RATES_DB.US.default;
                                    locationName = '美國 (預設)';
                                }
                            }
                            
                        } else {
                            // Non-US Countries
                            foundRate = TAX_RATES_DB[countryCode].rate;
                            locationName = TAX_RATES_DB[countryCode].name;
                        }
                    }

                    if (foundRate !== null) {
                        taxRate = foundRate;
                        taxRateInput.value = foundRate.toFixed(2);
                        
                        // Show success message
                        locationMsg.textContent = `📍 已切換至 ${locationName}`;
                        locationMsg.classList.remove('hidden');
                        
                        updateCalculations();
                    } else {
                        locationMsg.textContent = `⚠️ 未知地區 (${countryCode})，維持原設定`;
                        locationMsg.classList.remove('hidden');
                        locationMsg.classList.replace('text-brand-success', 'text-yellow-500');
                    }

                } catch (error) {
                    console.error("Locate error:", error.message || error);
                    alert('無法取得詳細位置資訊，請手動輸入稅率。');
                } finally {
                    locateBtn.innerHTML = originalBtnContent;
                    locateBtn.disabled = false;
                }
            }, (error) => {
                // Log clear error message instead of object
                console.error("Geolocation Error:", error.message, "(Code: " + error.code + ")");
                let msg = '無法取得位置。';
                if(error.code === 1) msg = '請允許瀏覽器存取位置以使用此功能。';
                alert(msg);
                locateBtn.innerHTML = originalBtnContent;
                locateBtn.disabled = false;
            });
        });

        /* ---- 6. Core Calculation Engine ----
           Called on every input change (tax rate, pre-tax, post-tax, tip slider).
           Reads from state vars (preTaxAmount, taxRate, tipPercent),
           computes derived values, and writes to all display elements.
           Post-tax input is also updated UNLESS the user is currently typing in it. */
        const updateCalculations = () => {
            try {
                // 1. Calculate Tax Amount
                const taxAmount = preTaxAmount * (taxRate / 100);
                
                // 2. Calculate Tip Amount (Tip is based on Pre-tax)
                const tipAmount = preTaxAmount * (tipPercent / 100);

                // 3. Calculate Post-tax (Pre + Tax)
                const postTaxAmount = preTaxAmount + taxAmount;

                // 4. Calculate Total Pay (Post-tax + Tip)
                const totalPay = postTaxAmount + tipAmount;

                // UI Updates
                if(tipPercentDisplay) tipPercentDisplay.textContent = `${tipPercent}%`;
                if(tipAmountDisplay) tipAmountDisplay.textContent = formatCurrency(tipAmount);
                if(totalPayDisplay) totalPayDisplay.textContent = formatCurrency(totalPay);
                if(taxAmountDisplay) taxAmountDisplay.textContent = formatCurrency(taxAmount);

                // Update Post-tax input only if it's not the currently focused element
                if (document.activeElement !== postTaxInput && postTaxInput) {
                    if (preTaxAmount === 0 && document.activeElement !== preTaxInput) {
                        postTaxInput.value = '';
                    } else {
                        postTaxInput.value = postTaxAmount > 0 ? postTaxAmount.toFixed(2) : '';
                    }
                }
            } catch (err) {
                console.error("Calculation Error:", err);
            }
        };

        /* ---- 7. Event Listeners ----
           Each listener is guarded with an existence check (defensive, in case
           DOM structure changes). All funnel into updateCalculations(). */

        // Tax rate manual edit — clamp to >= 0
        if(taxRateInput) {
            taxRateInput.addEventListener('input', (e) => {
                let val = parseInput(e.target.value);
                if (val < 0) val = 0;
                taxRate = val;
                updateCalculations();
            });
        }

        // Pre-tax input — directly sets the source-of-truth preTaxAmount
        if(preTaxInput) {
            preTaxInput.addEventListener('input', (e) => {
                preTaxAmount = parseInput(e.target.value);
                updateCalculations();
            });
        }

        // Post-tax input — reverse-calculates pre-tax: preTax = postTax / (1 + rate)
        if(postTaxInput) {
            postTaxInput.addEventListener('input', (e) => {
                const postVal = parseInput(e.target.value);
                const multiplier = 1 + (taxRate / 100);
                preTaxAmount = postVal / multiplier;
                if(preTaxInput) preTaxInput.value = preTaxAmount > 0 ? preTaxAmount.toFixed(2) : '';
                updateCalculations();
            });
        }

        // Tip slider — updates tipPercent (integer 10-24)
        if(tipSlider) {
            tipSlider.addEventListener('input', (e) => {
                tipPercent = parseInt(e.target.value);
                updateCalculations();
            });
        }

        /* ---- 8. App Icon — generated via canvas, injected as data URL ----
           Draws the same "小費雞" chicken onto an offscreen 180x180 canvas
           and assigns the result to the apple-touch-icon <link> element.
           No external icon.png file required. */
        function generateAppIcon() {
            try {
                const c = document.createElement('canvas');
                c.width = 180; c.height = 180;
                const ctx = c.getContext('2d');

                // Background: sky-blue rounded square (brand-accent #38bdf8)
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath(); ctx.roundRect(0, 0, 180, 180, 38); ctx.fill();

                const cream  = '#FFF8DC';
                const wing   = '#EEE4C3';
                const dark   = '#232323';
                const white  = '#FFFFFF';
                const orange = '#FFA014';
                const red    = '#D22D2D';
                const blush  = 'rgba(255,160,130,0.45)';

                // Wings (behind body — drawn first)
                ctx.fillStyle = wing;
                ctx.beginPath(); ctx.ellipse(52,  118, 28, 22, -0.3, 0, Math.PI * 2); ctx.fill(); // left
                ctx.beginPath(); ctx.ellipse(128, 118, 28, 22,  0.3, 0, Math.PI * 2); ctx.fill(); // right

                // Body
                ctx.fillStyle = cream;
                ctx.beginPath(); ctx.ellipse(90, 122, 48, 38, 0, 0, Math.PI * 2); ctx.fill();

                // Head
                ctx.fillStyle = cream;
                ctx.beginPath(); ctx.ellipse(90, 72, 32, 30, 0, 0, Math.PI * 2); ctx.fill();

                // Comb (3 red bumps)
                ctx.fillStyle = red;
                ctx.beginPath(); ctx.ellipse(80,  46, 9, 13, -0.2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(91,  40, 9, 14,    0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(102, 46, 9, 13,  0.2, 0, Math.PI * 2); ctx.fill();

                // Eyes
                ctx.fillStyle = dark;
                ctx.beginPath(); ctx.ellipse(76, 68, 7, 7, 0, 0, Math.PI * 2); ctx.fill(); // left
                ctx.beginPath(); ctx.ellipse(104,68, 7, 7, 0, 0, Math.PI * 2); ctx.fill(); // right
                // Highlights
                ctx.fillStyle = white;
                ctx.beginPath(); ctx.ellipse(78, 65, 3, 3, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(106,65, 3, 3, 0, 0, Math.PI * 2); ctx.fill();

                // Blush cheeks
                ctx.fillStyle = blush;
                ctx.beginPath(); ctx.ellipse(68, 78, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(112,78, 9, 6, 0, 0, Math.PI * 2); ctx.fill();

                // Beak (orange triangle)
                ctx.fillStyle = orange;
                ctx.beginPath();
                ctx.moveTo(83, 78); ctx.lineTo(97, 78); ctx.lineTo(90, 91);
                ctx.closePath(); ctx.fill();

                // Feet & toes
                ctx.fillStyle = orange;
                ctx.fillRect(78, 154, 9, 16);   // left leg
                ctx.fillRect(93, 154, 9, 16);   // right leg
                // Left toes
                ctx.beginPath(); ctx.ellipse(69,  168, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(82,  168, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
                // Right toes
                ctx.beginPath(); ctx.ellipse(95,  168, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(108, 168, 8, 5, 0, 0, Math.PI * 2); ctx.fill();

                document.getElementById('appleTouchIcon').href = c.toDataURL('image/png');
            } catch(e) { /* silently skip if canvas unavailable */ }
        }

        /* ---- 9. Initialize ---- */
        generateAppIcon();
        updateCalculations();

    </script>
</body>
